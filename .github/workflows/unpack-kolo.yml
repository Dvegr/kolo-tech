name: Unpack KOLO site files

on:
  push:
    branches: [main]
    paths:
      - 'KOLO_web.tar.bz2.base64'
      - '.github/workflows/unpack-kolo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack website sources
        shell: bash
        run: |
          base64 --decode KOLO_web.tar.bz2.base64 | tar -xjf -
          test -s index.html
          test -s styles.css
          test -s app.js
      - name: Commit website source files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css app.js assets/
          if ! git diff --cached --quiet; then
            git commit -m "Add full KOLO website sources"
            git push
          fi
